name: Silownia
options:
  bundleIdPrefix: pl.bilyukea
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Silownia:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    info:
      path: Config/iOS-Info.plist
      properties:
        CFBundleDisplayName: Siłownia
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: Приложение читает пульс и тренировки, чтобы строить графики и журнал.
        NSHealthUpdateUsageDescription: Приложение сохраняет тренировки в Здоровье.
    entitlements:
      path: Config/iOS.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.bilyukea.silownia
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: SilowniaWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    scheme: {}
  SilowniaWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    info:
      path: Config/Watch-Info.plist
      properties:
        CFBundleDisplayName: Siłownia
        WKApplication: true
        WKCompanionAppBundleIdentifier: pl.bilyukea.silownia
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: Часы читают пульс во время тренировки, чтобы вести программу по пульсу.
        NSHealthUpdateUsageDescription: Часы сохраняют тренировку в Здоровье.
    entitlements:
      path: Config/Watch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.bilyukea.silownia.watchkitapp
    scheme: {}
