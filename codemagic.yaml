# Сборки запускаются только вручную (Start new build), чтобы не тратить минуты.
workflows:
  check:
    name: Проверка (компиляция, без установки)
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: latest
    scripts:
      - name: Генерация проекта
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Компиляция iPhone + часы (симулятор)
        script: |
          set -o pipefail
          xcodebuild build \
            -project Silownia.xcodeproj \
            -scheme Silownia \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
    artifacts:
      - build.log

  screenshots:
    name: Скриншоты в симуляторах (iPhone + часы)
    instance_type: mac_mini_m2
    max_build_duration: 25
    environment:
      xcode: latest
    scripts:
      - name: Генерация проекта
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Сборка, запуск в симуляторах, скриншоты
        script: |
          bash scripts/screenshots.sh
    artifacts:
      - screenshots/*.png
      - screenshots.zip
      - build.log

  ipa:
    name: IPA для установки через Sideloadly
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Генерация проекта
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Архив без подписи
        script: |
          set -o pipefail
          xcodebuild archive \
            -project Silownia.xcodeproj \
            -scheme Silownia \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Silownia.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" build.log
      - name: Упаковка IPA (с entitlements для HealthKit)
        script: |
          set -e
          rm -rf Payload && mkdir Payload
          cp -R build/Silownia.xcarchive/Products/Applications/Silownia.app Payload/
          APP=Payload/Silownia.app
          WATCH=$APP/Watch/SilowniaWatch.app
          # Ad-hoc подпись с entitlements: сначала вложенное приложение для часов, потом телефонное.
          # Sideloadly переподпишет своим сертификатом, но возьмёт entitlements (HealthKit) отсюда.
          if [ -d "$WATCH" ]; then
            codesign --force --sign - --entitlements Config/Watch.entitlements --timestamp=none "$WATCH"
            codesign -d --entitlements - "$WATCH" 2>/dev/null | head -20 || true
          else
            echo "ВНИМАНИЕ: приложение для часов не встроено"
          fi
          codesign --force --sign - --entitlements Config/iOS.entitlements --timestamp=none "$APP"
          codesign -d --entitlements - "$APP" 2>/dev/null | head -20 || true
          zip -qry Silownia-unsigned.ipa Payload
          ls -la Silownia-unsigned.ipa
    artifacts:
      - Silownia-unsigned.ipa
      - build.log
